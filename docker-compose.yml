services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${KP_DB_USER:-kp}
      POSTGRES_PASSWORD: ${KP_DB_PASSWORD:-kp}
      POSTGRES_DB: ${KP_DB_NAME:-kp}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KP_DB_USER:-kp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      KP_DATABASE_URL: postgresql+psycopg://${KP_DB_USER:-kp}:${KP_DB_PASSWORD:-kp}@db:5432/${KP_DB_NAME:-kp}
      KP_ENVIRONMENT: ${KP_ENVIRONMENT:-production}
      KP_SECRET_KEY: ${KP_SECRET_KEY:?KP_SECRET_KEY is required}
      KP_SESSION_COOKIE_SECURE: ${KP_SESSION_COOKIE_SECURE:-false}
      KP_ALLOWED_ORIGINS: '["http://localhost:${KP_HTTP_PORT:-8080}","http://127.0.0.1:${KP_HTTP_PORT:-8080}","http://127.0.0.1:8090","http://localhost:8090"]'
      KP_STORAGE_ROOT: /data/documents
      KP_LEGACY_DOC_CONVERTER: ${KP_LEGACY_DOC_CONVERTER:-soffice}
      KP_DOCUMENT_FORMAT_LABEL: ${KP_DOCUMENT_FORMAT_LABEL:-PDF、Word（DOC/DOCX）、TXT、Markdown 和 HTML}
      KP_ANALYSIS_MODEL_BASE_URL: ${KP_ANALYSIS_MODEL_BASE_URL:-}
      KP_ANALYSIS_MODEL: ${KP_ANALYSIS_MODEL:-deepseek-flash}
      KP_ANALYSIS_MODEL_API_KEY: ${KP_ANALYSIS_MODEL_API_KEY:-}
      KP_ANALYSIS_MODEL_TIMEOUT_SECONDS: ${KP_ANALYSIS_MODEL_TIMEOUT_SECONDS:-90}
    volumes:
      - doc-storage:/data/documents
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python -m alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build: ./backend
    environment:
      KP_DATABASE_URL: postgresql+psycopg://${KP_DB_USER:-kp}:${KP_DB_PASSWORD:-kp}@db:5432/${KP_DB_NAME:-kp}
      KP_ENVIRONMENT: ${KP_ENVIRONMENT:-production}
      KP_SECRET_KEY: ${KP_SECRET_KEY:?KP_SECRET_KEY is required}
      KP_SESSION_COOKIE_SECURE: ${KP_SESSION_COOKIE_SECURE:-false}
      KP_ALLOWED_ORIGINS: '["http://localhost:${KP_HTTP_PORT:-8080}","http://127.0.0.1:${KP_HTTP_PORT:-8080}","http://127.0.0.1:8090","http://localhost:8090"]'
      KP_STORAGE_ROOT: /data/documents
      KP_LEGACY_DOC_CONVERTER: ${KP_LEGACY_DOC_CONVERTER:-soffice}
      KP_DOCUMENT_FORMAT_LABEL: ${KP_DOCUMENT_FORMAT_LABEL:-PDF、Word（DOC/DOCX）、TXT、Markdown 和 HTML}
      KP_ANALYSIS_MODEL_BASE_URL: ${KP_ANALYSIS_MODEL_BASE_URL:-}
      KP_ANALYSIS_MODEL: ${KP_ANALYSIS_MODEL:-deepseek-flash}
      KP_ANALYSIS_MODEL_API_KEY: ${KP_ANALYSIS_MODEL_API_KEY:-}
      KP_ANALYSIS_MODEL_TIMEOUT_SECONDS: ${KP_ANALYSIS_MODEL_TIMEOUT_SECONDS:-90}
    volumes:
      - doc-storage:/data/documents
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${KP_HTTP_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  db-data:
  doc-storage:
