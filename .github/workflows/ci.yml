name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  evaluation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - run: python evaluation/quality_tool.py validate

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kplatform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      KP_TEST_DATABASE_URL: postgresql+psycopg://kp_migrator:kp_migrator_test@127.0.0.1:5432/kplatform_test
      KP_TEST_ADMIN_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/kplatform_test
      KP_RLS_ROLE: kp_app
      KP_STORAGE_BACKEND: local
    steps:
      - uses: actions/checkout@v4
      - name: Create test database roles
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d kplatform_test -v ON_ERROR_STOP=1 \
            -c "create role kp_migrator login password 'kp_migrator_test' nosuperuser nocreatedb nocreaterole nobypassrls;" \
            -c "create role kp_app nologin nosuperuser nocreatedb nocreaterole nobypassrls;" \
            -c "grant kp_app to kp_migrator with admin option;"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app
      - name: Check V2 frontend types match backend contract
        run: python -m app.typegen --check
      - run: python -m pytest
      - name: Validate V2 fixed samples
        run: python ../evaluation/v2/validate_cases.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
